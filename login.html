<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login • Private</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #09090b;
      --surface: #111114;

      --border: rgba(255,255,255,.09);
      --border-focus: rgba(216,181,106,.65);

      --text: #f7f4ed;
      --muted: #999791;

      --gold: #d8b56a;
      --gold-light: #f0d797;

      --danger: #e77b7b;
      --success: #72d69a;
    }

    body {

      min-height: 100vh;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(216,181,106,.13),
          transparent 40%
        ),
        var(--bg);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================== */

    header {

      height: 72px;

      padding: 0 6%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border-bottom:
        1px solid var(--border);

      background:
        rgba(9,9,11,.75);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 100;
    }

    .brand {

      display: flex;

      align-items: center;

      gap: 10px;

      font-size: 18px;

      font-weight: 700;
    }

    .brand-icon {

      width: 34px;
      height: 34px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 10px;

      border:
        1px solid
        rgba(216,181,106,.4);

      color:
        var(--gold-light);

      font-weight: 800;
    }

    .back-button {

      border: none;

      background: transparent;

      color: #ccc8bf;

      font-size: 14px;

      font-weight: 600;

      padding: 10px;
    }

    .back-button:hover {

      color:
        var(--gold-light);
    }

    /* =========================
       PAGE
    ========================== */

    main {

      min-height: 100vh;

      padding:
        115px 20px 60px;

      display: flex;

      justify-content: center;

      align-items: flex-start;
    }

    .container {

      width: 100%;

      max-width: 480px;
    }

    .heading {

      text-align: center;

      margin-bottom: 30px;
    }

    .eyebrow {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      color:
        var(--gold-light);

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;

      margin-bottom: 16px;
    }

    .eyebrow-dot {

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background:
        var(--gold);
    }

    h1 {

      font-size: 40px;

      letter-spacing: -1.5px;

      line-height: 1.05;
    }

    .heading p {

      color:
        var(--muted);

      font-size: 14px;

      line-height: 1.6;

      margin-top: 12px;
    }

    /* =========================
       CARD
    ========================== */

    .card {

      padding: 27px;

      border-radius: 25px;

      border:
        1px solid
        var(--border);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.018)
        );

      box-shadow:
        0 30px 80px
        rgba(0,0,0,.35);
    }

    /* =========================
       MESSAGE
    ========================== */

    .message {

      display: none;

      padding: 12px 14px;

      border-radius: 12px;

      margin-bottom: 17px;

      font-size: 12px;

      line-height: 1.5;
    }

    .message.error {

      display: block;

      color: #f0aaaa;

      background:
        rgba(231,123,123,.08);

      border:
        1px solid
        rgba(231,123,123,.18);
    }

    .message.success {

      display: block;

      color: #9ae2b7;

      background:
        rgba(114,214,154,.08);

      border:
        1px solid
        rgba(114,214,154,.18);
    }

    /* =========================
       FORM
    ========================== */

    .field {

      margin-bottom: 18px;
    }

    .field-label {

      display: block;

      margin-bottom: 8px;

      color: #d7d3ca;

      font-size: 12px;

      font-weight: 650;
    }

    .input-wrap {

      position: relative;
    }

    input {

      width: 100%;

      height: 52px;

      padding:
        0 15px;

      border:
        1px solid
        var(--border);

      outline: none;

      border-radius: 13px;

      background:
        rgba(255,255,255,.035);

      color:
        var(--text);

      transition:
        border-color .2s,
        background .2s,
        box-shadow .2s;
    }

    input::placeholder {

      color:
        #66645f;
    }

    input:focus {

      border-color:
        var(--border-focus);

      background:
        rgba(255,255,255,.045);

      box-shadow:
        0 0 0 3px
        rgba(216,181,106,.06);
    }

    .password-input {

      padding-right: 50px;
    }

    /* =========================
       PASSWORD TOGGLE
    ========================== */

    .password-toggle {

      position: absolute;

      right: 8px;

      top: 50%;

      transform:
        translateY(-50%);

      border: none;

      background: transparent;

      color: #88857d;

      width: 36px;
      height: 36px;

      border-radius: 9px;
    }

    .password-toggle:hover {

      color:
        var(--gold-light);

      background:
        rgba(255,255,255,.04);
    }

    /* =========================
       FORGOT PASSWORD
    ========================== */

    .forgot-row {

      display: flex;

      justify-content: flex-end;

      margin-top: -8px;

      margin-bottom: 20px;
    }

    .forgot-button {

      border: none;

      background: transparent;

      color:
        var(--gold-light);

      font-size: 11px;

      font-weight: 600;

      padding: 5px 0;
    }

    .forgot-button:hover {

      color: #fff;
    }

    /* =========================
       LOGIN BUTTON
    ========================== */

    .login-button {

      width: 100%;

      height: 52px;

      border-radius: 14px;

      border:
        1px solid
        rgba(216,181,106,.5);

      background:
        linear-gradient(
          135deg,
          #e5c274,
          #c79d4e
        );

      color:
        #15120c;

      font-size: 14px;

      font-weight: 750;

      position: relative;

      transition:
        transform .2s,
        opacity .2s;
    }

    .login-button:hover:not(:disabled) {

      transform:
        translateY(-1px);
    }

    .login-button:disabled {

      opacity: .55;

      cursor: not-allowed;
    }

    /* =========================
       DIVIDER
    ========================== */

    .divider {

      display: flex;

      align-items: center;

      gap: 12px;

      margin: 23px 0;
    }

    .divider-line {

      flex: 1;

      height: 1px;

      background:
        var(--border);
    }

    .divider span {

      color:
        #66645f;

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 1px;
    }

    /* =========================
       GOOGLE
    ========================== */

    .google-button {

      width: 100%;

      height: 50px;

      border-radius: 13px;

      border:
        1px solid
        var(--border);

      background:
        rgba(255,255,255,.045);

      color:
        #e8e4db;

      font-size: 13px;

      font-weight: 650;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      transition:
        background .2s,
        transform .2s;
    }

    .google-button:hover:not(:disabled) {

      background:
        rgba(255,255,255,.07);

      transform:
        translateY(-1px);
    }

    .google-button:disabled {

      opacity: .55;

      cursor: not-allowed;
    }

    .google-icon {

      width: 20px;
      height: 20px;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    .google-icon svg {

      width: 20px;
      height: 20px;

      display: block;
    }

    /* =========================
       CREATE ACCOUNT
    ========================== */

    .create-area {

      text-align: center;

      margin-top: 23px;

      color:
        #77746d;

      font-size: 12px;
    }

    .create-link {

      border: none;

      background: transparent;

      color:
        var(--gold-light);

      font-weight: 650;

      padding: 0;

      margin-left: 4px;
    }

    .create-link:hover {

      color: #fff;
    }

    /* =========================
       LOADING
    ========================== */

    .spinner {

      width: 17px;
      height: 17px;

      border-radius: 50%;

      border:
        2px solid
        rgba(21,18,12,.3);

      border-top-color:
        #15120c;

      animation:
        spin .7s linear infinite;

      display: none;

      margin: auto;
    }

    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      header {

        padding:
          0 20px;
      }

      main {

        padding:
          105px 15px 45px;
      }

      .heading {

        margin-bottom: 22px;
      }

      h1 {

        font-size: 34px;
      }

      .card {

        padding:
          21px 17px;

        border-radius: 21px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="brand">

      <div class="brand-icon">
        P
      </div>

      <span>
        Private
      </span>

    </div>


    <button
      type="button"
      class="back-button"
      id="backButton"
    >
      Back
    </button>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <div class="container">


      <div class="heading">

        <div class="eyebrow">

          <span class="eyebrow-dot"></span>

          Welcome back

        </div>


        <h1>
          Sign in
        </h1>


        <p>
          Enter your details to continue
          to your private community.
        </p>

      </div>


      <div class="card">


        <!-- MESSAGE -->

        <div
          class="message"
          id="message"
        ></div>


        <!-- LOGIN FORM -->

        <form
          id="loginForm"
        >


          <!-- EMAIL -->

          <div class="field">

            <label
              class="field-label"
              for="email"
            >
              Email address
            </label>


            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              autocomplete="email"
              maxlength="120"
              required
            >

          </div>


          <!-- PASSWORD -->

          <div class="field">

            <label
              class="field-label"
              for="password"
            >
              Password
            </label>


            <div class="input-wrap">

              <input
                type="password"
                id="password"
                class="password-input"
                placeholder="Your password"
                autocomplete="current-password"
                required
              >


              <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
                aria-label="Show password"
              >
                ◉
              </button>

            </div>

          </div>


          <!-- FORGOT -->

          <div class="forgot-row">

            <button
              type="button"
              class="forgot-button"
              id="forgotButton"
            >
              Forgot password?
            </button>

          </div>


          <!-- LOGIN -->

          <button
            type="submit"
            class="login-button"
            id="loginButton"
          >

            <span id="loginText">
              Login
            </span>


            <span
              class="spinner"
              id="spinner"
            ></span>

          </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">

          <div class="divider-line"></div>

          <span>
            or
          </span>

          <div class="divider-line"></div>

        </div>


        <!-- GOOGLE -->

        <button
          type="button"
          class="google-button"
          id="googleButton"
        >

          <span class="google-icon">

            <!-- REAL GOOGLE G -->

            <svg
              viewBox="0 0 48 48"
              aria-hidden="true"
            >

              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.61 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.02 17.74 9.5 24 9.5z"
              />

              <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.64-.15-3.22-.42-4.74H24v9h12.93c-.57 3.06-2.31 5.65-4.92 7.39l7.98 6.19C44.64 38.22 46.98 31.86 46.98 24.55z"
              />

              <path
                fill="#FBBC05"
                d="M10.54 28.59A14.47 14.47 0 0 1 9.77 24c0-1.59.27-3.13.77-4.59l-7.98-6.19A24 24 0 0 0 0 24c0 3.88.93 7.56 2.56 10.78l7.98-6.19z"
              />

              <path
                fill="#34A853"
                d="M24 48c6.48 0 11.91-2.13 15.88-5.8l-7.98-6.19c-2.21 1.48-5.03 2.35-7.9 2.35-6.26 0-11.57-3.52-13.46-8.5l-7.98 6.19C6.51 42.62 14.61 48 24 48z"
              />

            </svg>

          </span>


          Continue with Google

        </button>


        <!-- CREATE ACCOUNT -->

        <div class="create-area">

          Don't have an account?


          <button
            type="button"
            class="create-link"
            id="createLink"
          >
            Create account
          </button>

        </div>


      </div>

    </div>

  </main>


  <!-- =========================
       FIREBASE
  ========================== -->

  <script type="module">


    /* ==========================================
       FIREBASE IMPORTS
    ========================================== */

    import {
      auth,
      googleProvider,
      db
    } from "./firebase.js";


    import {
      signInWithEmailAndPassword,
      signInWithPopup,
      sendPasswordResetEmail,
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* ==========================================
       ELEMENTS
    ========================================== */

    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const passwordToggle =
      document.getElementById(
        "passwordToggle"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const loginText =
      document.getElementById(
        "loginText"
      );


    const spinner =
      document.getElementById(
        "spinner"
      );


    const googleButton =
      document.getElementById(
        "googleButton"
      );


    const forgotButton =
      document.getElementById(
        "forgotButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    /* ==========================================
       PERSISTENT LOGIN
    ========================================== */

    try {

      await setPersistence(
        auth,
        browserLocalPersistence
      );

    } catch (error) {

      console.error(
        "Persistence error:",
        error
      );

    }


    /* ==========================================
       MESSAGE
    ========================================== */

    function showMessage(
      text,
      type = "error"
    ) {

      message.textContent =
        text;


      message.className =
        "message " + type;


      message.style.display =
        "block";

    }


    function clearMessage() {

      message.textContent =
        "";


      message.className =
        "message";


      message.style.display =
        "none";

    }


    /* ==========================================
       LOADING
    ========================================== */

    function setLoading(
      loading
    ) {

      loginButton.disabled =
        loading;


      googleButton.disabled =
        loading;


      forgotButton.disabled =
        loading;


      loginText.style.display =
        loading
          ? "none"
          : "inline";


      spinner.style.display =
        loading
          ? "block"
          : "none";

    }


    /* ==========================================
       PASSWORD SHOW / HIDE
    ========================================== */

    passwordToggle.addEventListener(
      "click",
      () => {

        if (
          passwordInput.type ===
          "password"
        ) {

          passwordInput.type =
            "text";


          passwordToggle.textContent =
            "○";

        } else {

          passwordInput.type =
            "password";


          passwordToggle.textContent =
            "◉";

        }

      }
    );


    /* ==========================================
       BACK
    ========================================== */

    document
      .getElementById("backButton")
      .addEventListener(
        "click",
        () => {

          window.location.href =
            "index.html";

        }
      );


    /* ==========================================
       CREATE ACCOUNT
    ========================================== */

    document
      .getElementById("createLink")
      .addEventListener(
        "click",
        () => {

          window.location.href =
            "create-account.html";

        }
      );


    /* ==========================================
       CHECK FIRESTORE PROFILE
    ========================================== */

    async function hasProfile(
      user
    ) {

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      const snapshot =
        await getDoc(
          userRef
        );


      return snapshot.exists();

    }


    /* ==========================================
       EMAIL LOGIN
    ========================================== */

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        clearMessage();


        const email =
          emailInput.value
            .trim();


        const password =
          passwordInput.value;


        if (!email) {

          showMessage(
            "Please enter your email address."
          );

          return;

        }


        if (!password) {

          showMessage(
            "Please enter your password."
          );

          return;

        }


        setLoading(true);


        try {

          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          /* ==============================
             CHECK PROFILE
          ============================== */

          const profileExists =
            await hasProfile(
              user
            );


          if (!profileExists) {

            await signOut(
              auth
            );


            throw new Error(
              "Your account exists, but your Private profile has not been completed. Please create your profile."
            );

          }


          /* ==============================
             SUCCESS
          ============================== */

          showMessage(
            "Login successful. Opening Private...",
            "success"
          );


          setTimeout(
            () => {

              window.location.href =
                "home.html";

            },
            700
          );


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          let errorMessage =
            "Could not log you in.";


          switch (
            error.code
          ) {

            case "auth/invalid-credential":

              errorMessage =
                "Incorrect email or password.";

              break;


            case "auth/wrong-password":

              errorMessage =
                "Incorrect email or password.";

              break;


            case "auth/user-not-found":

              errorMessage =
                "No account was found with this email address.";

              break;


            case "auth/invalid-email":

              errorMessage =
                "Please enter a valid email address.";

              break;


            case "auth/user-disabled":

              errorMessage =
                "This account has been disabled.";

              break;


            case "auth/too-many-requests":

              errorMessage =
                "Too many login attempts. Please wait and try again.";

              break;


            case "auth/network-request-failed":

              errorMessage =
                "Network error. Please check your internet connection.";

              break;


            case "permission-denied":

            case "firestore/permission-denied":

              errorMessage =
                "Unable to verify your profile. Please check your Firebase rules.";

              break;


            default:

              if (
                error.message
              ) {

                errorMessage =
                  error.message;

              }

          }


          showMessage(
            errorMessage
          );


        } finally {

          setLoading(false);

        }

      }
    );


    /* ==========================================
       GOOGLE LOGIN
    ========================================== */

    googleButton.addEventListener(
      "click",
      async () => {

        clearMessage();


        setLoading(true);


        try {

          /*
            Popup is intentionally used.

            This avoids the browser
            sessionStorage problem caused
            by signInWithRedirect().
          */

          const result =
            await signInWithPopup(
              auth,
              googleProvider
            );


          const user =
            result.user;


          /* ==============================
             CHECK PRIVATE PROFILE
          ============================== */

          const profileExists =
            await hasProfile(
              user
            );


          if (!profileExists) {

            await signOut(
              auth
            );


            showMessage(
              "This Google account is not registered in Private yet. Please create an account first."
            );


            setLoading(false);

            return;

          }


          /* ==============================
             SUCCESS
          ============================== */

          showMessage(
            "Login successful. Opening Private...",
            "success"
          );


          setTimeout(
            () => {

              window.location.href =
                "home.html";

            },
            700
          );


        } catch (error) {

          console.error(
            "Google login error:",
            error
          );


          let errorMessage =
            "Google login could not be completed.";


          switch (
            error.code
          ) {

            case "auth/popup-closed-by-user":

              errorMessage =
                "Google sign-in was cancelled.";

              break;


            case "auth/popup-blocked":

              errorMessage =
                "The browser blocked the Google login popup. Please allow popups for this site.";

              break;


            case "auth/unauthorized-domain":

              errorMessage =
                "This website is not authorized for Google Sign-In in Firebase.";

              break;


            case "auth/operation-not-allowed":

              errorMessage =
                "Google Sign-In is not enabled in Firebase Authentication.";

              break;


            case "auth/network-request-failed":

              errorMessage =
                "Network error. Please check your internet connection.";

              break;


            default:

              if (
                error.message
              ) {

                errorMessage =
                  error.message;

              }

          }


          showMessage(
            errorMessage
          );


        } finally {

          setLoading(false);

        }

      }
    );


    /* ==========================================
       FORGOT PASSWORD
    ========================================== */

    forgotButton.addEventListener(
      "click",
      async () => {

        clearMessage();


        const email =
          emailInput.value
            .trim();


        if (!email) {

          showMessage(
            "Enter your email address first, then tap Forgot password."
          );

          emailInput.focus();

          return;

        }


        setLoading(true);


        try {

          await sendPasswordResetEmail(
            auth,
            email
          );


          showMessage(
            "Password reset email sent. Check your inbox.",
            "success"
          );


        } catch (error) {

          console.error(
            "Password reset error:",
            error
          );


          let errorMessage =
            "Could not send the password reset email.";


          switch (
            error.code
          ) {

            case "auth/invalid-email":

              errorMessage =
                "Please enter a valid email address.";

              break;


            case "auth/user-not-found":

              errorMessage =
                "No account was found with this email address.";

              break;


            case "auth/network-request-failed":

              errorMessage =
                "Network error. Please check your internet connection.";

              break;


            default:

              if (
                error.message
              ) {

                errorMessage =
                  error.message;

              }

          }


          showMessage(
            errorMessage
          );


        } finally {

          setLoading(false);

        }

      }
    );


    /* ==========================================
       EXISTING AUTH SESSION
    ========================================== */

    onAuthStateChanged(
      auth,
      async user => {

        if (!user) {
          return;
        }


        /*
          Don't automatically redirect while
          the login page is initially loading.

          This prevents unwanted redirects if
          someone opens login.html manually.
        */

      }
    );


  </script>

</body>
